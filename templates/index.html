<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Industrial Energy Predictor</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f1f5f9;
            color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: #ffffff;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 460px;
        }
        h2 {
            text-align: center;
            color: #0284c7;
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 1rem;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }
        input, select {
            width: 100%;
            padding: 0.65rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.5rem;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result-box {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: #e0f2fe;
            border-left: 4px solid #0284c7;
            border-radius: 6px;
            text-align: center;
        }
        .result-box h3 {
            margin: 0 0 0.5rem 0;
            color: #0369a1;
        }
        .metrics {
            font-size: 0.85rem;
            color: #334155;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Industrial Energy Predictor</h2>
        <form method="POST">
            <div class="form-group">
                <label>Lagging Current Reactive Power (kvarh)</label>
                <input type="number" step="any" name="lagging" value="{{ inputs.lagging }}" required>
            </div>
            <div class="form-group">
                <label>Leading Current Reactive Power (kvarh)</label>
                <input type="number" step="any" name="leading" value="{{ inputs.leading }}" required>
            </div>
            <div class="form-group">
                <label>CO2 Emission (ppm)</label>
                <input type="number" step="any" name="co2" value="{{ inputs.co2 }}" required>
            </div>
            <div class="form-group">
                <label>Power Factor (%)</label>
                <input type="number" step="any" name="pf" value="{{ inputs.pf }}" required>
            </div>
            <div class="form-group">
                <label>Select Machine Learning Model</label>
                <select name="model">
                    {% for m in models %}
                    <option value="{{ m }}" {% if m == selected_model %}selected{% endif %}>{{ m }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit">Predict Energy Consumption</button>
        </form>

        {% if prediction is not none %}
        <div class="result-box">
            <h3>Predicted Output: {{ prediction }} kWh</h3>
            {% if metrics %}
            <div class="metrics">
                <strong>Model:</strong> {{ selected_model }} | 
                <strong>R² Score:</strong> {{ metrics.R2 }} | 
                <strong>MAE:</strong> {{ metrics.MAE }}
            </div>
            {% endif %}
        </div>
        {% endif %}
    </div>
</body>
</html>
